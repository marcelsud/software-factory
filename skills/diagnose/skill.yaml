id: diagnose
version: 1
compatibility: 1
instruction: instructions.md
includes: [guidance.md]
inputArtifacts: [reproduction, result.json]
resultSchema:
  type: object
  properties:
    schemaVersion: { type: number }
    outcome: { type: string }
    summary: { type: string }
    rootCause: { type: string }
    evidence: { type: string-array }
    confidence: { type: number }
    architectureChecked: { type: boolean }
    docsChecked: { type: boolean }
  required: [schemaVersion, outcome, summary, rootCause, evidence, confidence, architectureChecked, docsChecked]
  additionalProperties: false
capabilities: [repository.read]
customizable: false
