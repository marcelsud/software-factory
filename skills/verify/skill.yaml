id: verify
version: 1
compatibility: 1
instruction: instructions.md
includes: [guidance.md]
inputArtifacts: [patch, report.md, result.json, test-result]
resultSchema:
  type: object
  properties:
    schemaVersion: { type: number }
    decision: { type: string }
    summary: { type: string }
    evidence: { type: string-array }
    checks: { type: string-array }
    producerAttemptId: { type: string }
    approvedAttemptId: { type: string }
  required: [schemaVersion, decision, summary, evidence, checks, producerAttemptId, approvedAttemptId]
  additionalProperties: false
capabilities: [repository.read, process.test]
customizable: false
