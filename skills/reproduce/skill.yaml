id: reproduce
version: 1
compatibility: 1
instruction: instructions.md
includes: [guidance.md]
inputArtifacts: [metadata]
resultSchema:
  type: object
  properties:
    schemaVersion: { type: number }
    outcome: { type: string }
    summary: { type: string }
    evidence: { type: string-array }
    reproductionSteps: { type: string-array }
    observedBehavior: { type: string }
    expectedBehavior: { type: string }
  required: [schemaVersion, outcome, summary, evidence, reproductionSteps, observedBehavior, expectedBehavior]
  additionalProperties: false
capabilities: [repository.read]
customizable: false
